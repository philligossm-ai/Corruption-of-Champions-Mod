name: Build private CoC SWF

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLEX_HOME: build-dep/bin/flex/

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [release, debug]

    steps:
      - name: Checkout (with build dependencies)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Raise the compiler heap
        run: |
          CFG=build-dep/bin/flex/bin/JVM.config
          if [ -f "$CFG" ]; then
            sed -i -E 's/-Xmx[0-9]+[mMgG]/-Xmx2048m/' "$CFG"
            grep -n 'Xmx' "$CFG" || true
          else
            echo "::warning::JVM.config not found at $CFG"
            find build-dep -name 'JVM.config' -print 2>/dev/null || true
          fi

      - name: Verify Flex SDK is present
        run: |
          test -f "$FLEX_HOME/ant/lib/flexTasks.jar" || { echo "flexTasks.jar missing under $FLEX_HOME"; exit 1; }
          ls "$FLEX_HOME"

      - name: Build ${{ matrix.target }}
        run: ant ${{ matrix.target }}

      - name: Show build output
        if: always()
        run: ls -la target/ || true

      - name: Upload SWF
        uses: actions/upload-artifact@v4
        with:
          name: CoC-${{ matrix.target }}
          path: target/CoC-${{ matrix.target }}.swf
          if-no-files-found: error
          retention-days: 90
